name: contour
description: Contour — local-first personal finance app. No server, no account. Synthetic data only in Phase 1 (PF-01).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # Icons — Lucide SVG assets bundled in lib/design/icons (DESIGN 2.11). ISC licence.
  flutter_svg: 2.3.0
  # Exact math — Decimal only, never double for money (AGENTS 2.3, SPEC 4.1).
  # BSD-3-Clause licence. No network. See docs/DECISIONS.md (CR-08-DEPENDENCIES).
  decimal: 2.3.3
  # Unused packages are removed until their owning task adds them with a
  # DECISIONS record (AGENTS 6.8, CR-08). Owning tasks:
  #   T06/T09 flutter_riverpod, riverpod_annotation, build_runner,
  #           riverpod_generator  (state; AGENTS 6.2)
  #   T07     drift, drift_dev, a verified SQLCipher driver (SYSTEM_DESIGN A02)
  #   T09     go_router  (routing; AGENTS 3)
  #   T10     intl, chosen by flutter_localizations — do not pin it (CR-08)
  #   uuid    not needed: lib/core/ids.dart writes UUIDv7 (CR-08)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  # Design and privacy lint rules (DESIGN 9). Lands early in T12.
  custom_lint: 0.6.4

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: lib/design/fonts/Inter-ExtraLight.ttf
          weight: 200
        - asset: lib/design/fonts/Inter-Regular.ttf
          weight: 400
        - asset: lib/design/fonts/Inter-Medium.ttf
          weight: 500
        - asset: lib/design/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: Inter Display
      fonts:
        - asset: lib/design/fonts/InterDisplay-ExtraLight.ttf
          weight: 200
        - asset: lib/design/fonts/InterDisplay-Light.ttf
          weight: 300

  assets:
    - lib/design/icons/

