name: contour
description: Contour — local-first personal finance app. No server, no account. Synthetic data only in Phase 1 (PF-01).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # State — one provider per state, code generation (AGENTS 6.2)
  flutter_riverpod: 2.5.1
  riverpod_annotation: 2.3.5
  # Routing — router sets Section per route (AGENTS 3, DESIGN 3)
  go_router: 14.2.0
  # Storage — Drift typed access only; cipher adapter verified in T07 (SYSTEM_DESIGN A02)
  # NOTE(T07): no sqlite driver in T01. Driver lands with verified SQLCipher adapter.
  drift: 2.20.0
  # Icons — Lucide SVG assets bundled in lib/design/icons (DESIGN 2.11). ISC licence.
  flutter_svg: 2.3.0
  # Exact math — Decimal only, never double for money (AGENTS 2.3, SPEC 4.1)
  decimal: 2.3.3
  uuid: 4.2.2
  intl: 0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  build_runner: 2.4.9
  drift_dev: 2.20.0
  riverpod_generator: 2.4.0
  custom_lint: 0.6.4

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: lib/design/fonts/Inter-ExtraLight.ttf
          weight: 200
        - asset: lib/design/fonts/Inter-Regular.ttf
          weight: 400
        - asset: lib/design/fonts/Inter-Medium.ttf
          weight: 500
        - asset: lib/design/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: Inter Display
      fonts:
        - asset: lib/design/fonts/InterDisplay-ExtraLight.ttf
          weight: 200
        - asset: lib/design/fonts/InterDisplay-Light.ttf
          weight: 300

  assets:
    - lib/design/icons/

